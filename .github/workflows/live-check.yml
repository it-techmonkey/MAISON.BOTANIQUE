name: Live checkout check

# Every hour, runs the read-only buying-flow tests tagged @live against the
# production site. Nothing is ordered and no contact, address, discount or
# payment details are entered; the run stops on Shopify's checkout page.
# A failure emails the person who last changed the schedule below (GitHub's
# rule for scheduled workflows) and opens or updates a "Live checkout check
# failing" issue, which notifies repository watchers.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://maisonbotaniqueflowers.com
      E2E_EXPECT_LIVE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run @live tests against production
        run: npx playwright test --grep @live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-live
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  alert:
    needs: live
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Live checkout check failing"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          body="The hourly check of https://maisonbotaniqueflowers.com failed at $(date -u '+%Y-%m-%d %H:%M UTC'). The buying flow or the Shopify checkout handoff may be broken. Run: $RUN_URL"
          if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
