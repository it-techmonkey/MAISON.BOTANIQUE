name: Live checkout check

# Runs the @live buying-flow tests against production only when started manually.
# Nothing is ordered and no contact, address, discount or payment details are
# entered; the run stops on Shopify's checkout page.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      E2E_BASE_URL: https://maisonbotaniqueflowers.com
      E2E_EXPECT_LIVE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run @live tests against production
        run: npx playwright test --grep @live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-live
          path: |
            playwright-report/
            test-results/
          retention-days: 14
