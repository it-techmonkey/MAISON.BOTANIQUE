function head(title,sub,kicker=''){return `<div class="pagehead"><div>${kicker?`<div class="eyebrow" style="margin-bottom:9px">${kicker}</div>`:''}<h1>${title}</h1><p>${sub}</p></div><div class="date">Saturday, 24 October<br>Dubai · sample briefing</div></div>`;}
function foot(){return '<div class="endnote">Illustrative records, owners and workflow · no live verification or business updates</div>';}
function action(id,n){const r=records[id];return `<div class="actionrow"><span class="number">${n}</span><div><button class="actiontitle" data-record="${id}">${r.title}</button><p class="small">${r.owner} · ${r.status}</p><p class="small">${r.dependency}</p></div><button class="chevron" data-record="${id}" aria-label="Open ${r.title}">↗</button></div>`;}
function deptRows(){return names.map((n,i)=>`<button class="deptrow" data-dept="${i}"><span>${n}</span><span>${summaries[i]}</span><span>${owners[i]}</span><span>↗</span></button>`).join('');}
function briefing(){return head('Your business, in focus.','One decision to prepare. Work that can move while you decide.','The founder’s briefing')+`<div class="briefgrid"><section class="focus"><div class="eyebrow gold">Needs Alex · suggested first move</div><h2>Clear the evidence for<br>launch pricing.</h2><p>Review costs and the offer before approving the sample interim prices. This unlocks final catalogue pricing and a meaningful checkout test.</p><div class="focusmeta"><span><span class="small">Accountable</span>Alex</span><span><span class="small">Assistance</span>Claude</span><span><span class="small">Confidence</span>Evidence not reviewed</span></div><button class="primary" data-record="pricing">Review the decision <span>↗</span></button><p class="caption">Suggested priority in this sample scenario—not a live ranking.</p></section><section class="readiness"><div class="sectiontitle"><h2>What stands before orders</h2><button class="small" data-page="path">See path ↗</button></div><div class="gates"><button class="gate" data-page="decisions"><span class="number">01</span><span><span class="gatename">Brand foundation</span><div class="gatestatus">Policy recorded</div></span></button><button class="gate current" data-record="pricing"><span class="number">02</span><span><span class="gatename">Products & prices</span><div class="gatestatus">Approval blocked by evidence</div></span></button><button class="gate" data-record="checkout"><span class="number">03</span><span><span class="gatename">Ordering</span><div class="gatestatus">Needs live verification</div></span></button><button class="gate" data-record="courier"><span class="number">04</span><span><span class="gatename">Fulfilment</span><div class="gatestatus">Can progress in parallel</div></span></button><button class="gate" data-page="path"><span class="number">05</span><span><span class="gatename">Launch outreach</span><div class="gatestatus">Waits on ordering readiness</div></span></button><button class="gate" data-page="path"><span class="number">06</span><span><span class="gatename">First real orders</span><div class="gatestatus">Paid, delivered, reviewed</div></span></button></div></section></div><div class="briefgrid lower"><section><div class="sectiontitle"><h2>Work that can move</h2><button class="small" data-page="mine">My work ↗</button></div>${action('margin','01')}${action('courier','02')}</section><section><div class="sectiontitle"><h2>Since the last review</h2><span class="small">Sample activity</span></div><div class="activity"><span class="badge">${state.update==='accepted'?'Reported complete':'Review proposed update'}</span><p>Claude reports the delivery change implemented.</p><p class="small">Live behavior remains unverified.</p><button data-page="updates">Review the handoff →</button></div><div class="activity"><span class="small">Settled decision</span><p>Delivery policy stays in the decision record.</p><button data-page="decisions">See approved direction →</button></div></section></div><section class="departments"><div class="sectiontitle"><h2>Across the business</h2><span class="small">Department · next constraint · owner</span></div>${deptRows()}</section>`+foot();}
function workrow(id){const r=records[id];return `<div class="workrow"><div><button data-record="${id}">${r.title}</button><p class="small">${r.dependency}</p></div><span class="small">${r.owner}<br>${r.assistant.startsWith('Claude')?'Claude assists':''}</span><span class="badge ${r.status==='Needs a decision'?'rust':''}">${r.status}</span><button class="chevron" data-record="${id}" aria-label="Open ${r.title}">↗</button></div>`;}
function department(){const i=state.dept;return `<div class="breadcrumbs"><button data-page="brief">Company briefing</button><span>/</span><span>Departments</span></div>`+head(names[i],summaries[i],'Department view')+`<div class="deptintro"><div><div class="eyebrow">Contribution to first orders</div><p>${i===0?'Customers can choose a product with approved contents, imagery and pricing.':i===1?'Customers can place a complete order through a verified shopping flow.':i===2?'A paid order can be prepared and dispatched through a known process.':'Work here supports the same company outcome; department detail is illustrative.'}</p></div><div><div class="eyebrow">Accountability</div><p>${owners[i]} owns the outcome.<br>${workByDept[i].filter(id=>!records[id].complete).length} open · ${workByDept[i].filter(id=>records[id].complete).length} completed sample records.<br>AI assistance is recorded on individual tasks.</p></div></div><div class="tabs" aria-label="Department records"><button data-tab="active" aria-pressed="${state.tab==='active'}">Open work</button><button data-tab="complete" aria-pressed="${state.tab==='complete'}">Completed</button><button data-tab="policy" aria-pressed="${state.tab==='policy'}">Settled decisions</button></div>${state.tab==='policy'?policies():state.tab==='complete'?((workByDept[i].filter(id=>records[id].complete).map(workrow).join(''))||'<p class="caption">No verified completion is illustrated for this department.</p>'):workByDept[i].filter(id=>!records[id].complete).map(workrow).join('')||'<p class="caption">Detailed sample work is not populated here. The department’s constraint remains visible above.</p>'}<div class="notebox">Company context stays above this department. A reported result does not close its verification work.</div>`+foot();}
function policies(){return settled.map(([title,text])=>`<section class="recordsection"><h2>${title}</h2><p>${text}</p><p class="small">Source: fictional demo policy · live implementation is separate</p></section>`).join('');}
function record(){const r=records[state.record];return `<div class="breadcrumbs"><button data-page="brief">Company briefing</button><span>/</span><button data-dept="${r.dept}">${names[r.dept]}</button><span>/</span><span>${state.record==='pricing'?'Decision':'Work record'}</span></div><button class="back" data-return="true">← Back to ${state.origin==='dept'?'department':state.origin==='mine'?'my work':state.origin==='updates'?'updates':state.origin==='path'?'path to orders':'briefing'}</button>`+head(r.title,r.why,`${r.status} · sample record`)+`<div class="recordgrid"><div><section class="recordsection"><h2>${state.record==='pricing'?'Recommended next action':'Next action'}</h2><p>${r.next}</p></section><section class="recordsection"><h2>Dependency and business effect</h2><p>${r.dependency}</p><p>${r.unblocks}</p></section><section class="recordsection"><h2>What counts as complete</h2><p>${r.done}</p></section><section class="recordsection"><h2>Evidence</h2><div class="evidence"><button data-source="true">${r.source} ↗</button><p class="small">${r.sourceNote}</p></div><div id="source-detail" hidden class="notebox">This is the source-inspection state. The finished workspace would show the original reference, relevant excerpt and date here. No source contents were imported into this preview.</div></section><section class="recordsection"><h2>Record history</h2><ul class="timeline"><li><span class="small">Sample event · 24 Oct, 09:10</span>${state.record==='size'?'Owner acknowledgement attached in this illustrative history.':'Open work and its source reference captured.'}</li><li><span class="small">Current state</span>${r.verified}. ${state.record==='size'?'This sample event is not evidence of a new business action.':'No verified completion recorded.'}</li></ul></section></div><aside><div class="facts"><dl><div class="fact"><dt>ACCOUNTABLE HUMAN</dt><dd>${r.owner}</dd></div><div class="fact"><dt>AI ASSISTANCE</dt><dd>${r.assistant}</dd></div><div class="fact"><dt>WORK STATUS</dt><dd>${r.status}</dd></div><div class="fact"><dt>VERIFICATION</dt><dd class="rust">${r.verified}</dd></div><div class="fact"><dt>TIMING</dt><dd>${r.due}</dd></div><div class="fact"><dt>FRESHNESS</dt><dd>Sample snapshot · 24 October<br>No live refresh</dd></div></dl></div><div class="notebox">${state.record==='pricing'?'Approving a price decision would not publish prices or change Shopify.':'Implementation, release and verification remain separate facts.'}</div><button class="outline" style="margin-top:15px" data-dept="${r.dept}">Open department →</button></aside></div>`+foot();}
function mine(){let ids=Object.keys(records).filter(id=>!records[id].complete&&(state.owner==='All'||records[id].owner===state.owner||state.owner==='Claude'&&records[id].assistant.startsWith('Claude')));return head('The work in your hands.','Filter by accountable person or by AI assistance.','My work')+`<div class="filterbar" aria-label="Work filters"><span class="small">Show</span>${['All','Alex','Sam','Claude'].map(n=>`<button data-owner="${n}" aria-pressed="${state.owner===n}">${n}</button>`).join('')}</div>${state.owner==='Claude'?'<div class="notebox" style="margin-bottom:20px">Claude is an assistant. Each record still has one accountable human.</div>':''}${ids.map(workrow).join('')}${state.capture.map(t=>`<div class="workrow"><div>${esc(t.title)}<p class="small">Captured locally · completion condition to confirm</p></div><span class="small">${esc(t.owner)}</span><span class="badge">Inbox</span></div>`).join('')}`+foot();}
function path(){return head('What must be true to take orders.','Readiness is checked at each requirement. Departments can progress in parallel.','Path to first real orders')+`<section class="mapgroup"><h2>Prepare the offer</h2><div class="branch"><span class="number">01</span><div><p>Brand foundation</p><p class="small">Core policies are recorded; implementation is checked separately.</p></div><button class="small" data-page="decisions">View decisions ↗</button></div><div class="branch"><span class="number">02</span><div><button data-record="pricing">Products & prices →</button><p class="small">Margin evidence → owner price decision → catalogue update.</p></div><span class="badge rust">Decision preparation</span></div></section><section class="mapgroup"><h2>Make ordering and delivery reliable</h2><div class="branch"><span class="number">03</span><div><button data-record="checkout">Ordering →</button><p class="small">Pricing + shipping configuration → complete checkout verification.</p></div><span class="badge">Verification needed</span></div><div class="branch"><span class="number">04</span><div><button data-record="courier">Fulfilment →</button><p class="small">Packaging + courier handoff can progress alongside ordering.</p></div><span class="badge">Parallel work</span></div></section><section class="mapgroup"><h2>Reach customers and fulfil the first order</h2><div class="branch"><span class="number">05</span><div><p>Launch outreach</p><p class="small">Approved message and assets; customer ordering must be ready.</p></div><button class="small" data-dept="3">Marketing ↗</button></div><div class="branch"><span class="number">06</span><div><p>First real orders</p><p class="small">Paid order → successful delivery → review of the experience.</p></div><span class="badge">Business outcome</span></div></section><div class="notebox">No percentage is inferred from task counts. A milestone needs its own completion evidence.</div>`+foot();}
function decisions(){return head('Decisions that hold their context.','Pending choices and approved direction live together. Older notes do not silently reopen policy.','Decision record')+`<div class="sectiontitle"><h2>Needs your decision</h2><span class="small">Sample review queue</span></div>${workrow('pricing')}${workrow('briefs')}<section style="margin-top:28px"><div class="sectiontitle"><h2>Settled direction</h2><span class="small">From supplied owner instructions</span></div>${policies()}</section><div class="notebox">A suspected conflict becomes a review item with both sources and dates. An approved replacement preserves the earlier decision as superseded.</div>`+foot();}
function updates(){return head('A handoff, ready to review.','An AI report proposes a change. Evidence determines what the shared record can claim.','Updates to review')+`<section class="focus"><div class="eyebrow">Claude → Website & technology</div><h2>Delivery change implemented.</h2><p>Illustrative session handoff. Accountable human: Sam. The session reports implementation; deployment and live behavior have not been verified.</p><div class="diff"><div><div class="eyebrow">Proposed by the session</div><p style="margin-top:8px">Completed</p></div><span>→</span><div><div class="eyebrow">Appropriate shared status</div><p style="margin-top:8px">Reported complete<br><span class="small">Awaiting verification</span></p></div></div><button class="small" data-record="lead">Inspect work record and source →</button><div class="reviewactions"><button class="primary" data-accept="true">${state.update==='accepted'?'Accepted in this preview':'Accept as reported'}</button><button class="outline" data-pending="true">Keep pending</button></div><p class="caption" role="status">${state.update==='accepted'?'Sample record updated locally. Live verification remains open.':'Neither action changes production or marks the business outcome verified.'}</p></section><section class="recordsection" style="margin-top:25px"><h2>What the handoff carries</h2><p>Existing record reference · work performed · source evidence · remaining checks · accountable human.</p><p>A duplicate report attaches to the same record rather than creating another task.</p></section>`+foot();}
function weekly(){return head('Close the week with a clear next move.','Review changes and evidence before choosing what to carry forward.','Weekly review')+`<section class="recordsection"><h2>What moved</h2><p>The illustrative delivery implementation report is ${state.update==='accepted'?'accepted as reported':'awaiting review'}. Live verification remains open.</p><button class="small gold" style="margin-top:10px" data-page="updates">Review handoff →</button></section><section class="recordsection"><h2>What is still holding progress</h2><p>Pricing needs reviewed margin evidence. Final checkout verification depends on approved inputs. Courier handoff can progress in parallel.</p></section><section class="recordsection"><h2>What changed in the plan</h2><p>No schedule change is assumed. Reconfirm priorities with Alex and Sam before assigning new dates.</p></section><section class="recordsection"><h2>Proposed next commitments</h2><ul><li>Alex: review margin evidence before approving prices.</li><li>Sam: confirm the courier process and prepare checkout verification.</li><li>Claude: consolidate evidence and capture remaining checks.</li></ul></section><button class="outline" data-page="mine">Inspect the work →</button>`+foot();}
function capture(){return head('Capture now. Clarify before scheduling.','A quick note becomes inbox work until ownership and completion are clear.','Quick capture')+`<form id="capture-form"><label for="capture-title">Task</label><input id="capture-title" name="title" required placeholder="Confirm packaging availability"><div class="formgrid"><div><label for="capture-owner">Accountable human</label><select id="capture-owner" name="owner"><option>Unassigned</option><option>Alex</option><option>Sam</option></select></div><div><label for="capture-dept">Department</label><select id="capture-dept" name="department">${names.map(n=>`<option>${n}</option>`).join('')}</select></div></div><label for="capture-note">Context or source</label><textarea id="capture-note" rows="3" placeholder="What prompted this, and where can we check it?"></textarea><button class="primary" type="submit" style="margin-top:20px">Add to sample inbox →</button><p class="message" id="capture-message" role="status"></p></form>`+foot();}
function render(){records.lead.status=state.update==='accepted'?'Reported complete':'Update proposed';root.querySelectorAll('[data-page].navitem').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});root.querySelector('#mb-mobile').value=state.page==='record'?'dept':state.page;const labels={brief:'Briefing',dept:names[state.dept],mine:'My work',path:'Path to orders',decisions:'Decisions',updates:'Updates to review',weekly:'Weekly review',record:'Work & decision detail',capture:'Quick capture'};root.querySelector('#mb-location').textContent='Company / '+labels[state.page];content.innerHTML=({brief:briefing,dept:department,record,mine,path,decisions,updates,weekly,capture}[state.page]||briefing)();}
root.querySelector('.deptnav').innerHTML=short.map((n,i)=>`<button class="deptlink" data-dept="${i}">${n}</button>`).join('');
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let changed=false;if(b.dataset.page){state.page=b.dataset.page;changed=true;}if(b.dataset.dept!==undefined){state.page='dept';state.dept=Number(b.dataset.dept);state.tab='active';changed=true;}if(b.dataset.record){state.origin=state.page==='record'?'brief':state.page;state.record=b.dataset.record;state.page='record';changed=true;}if(b.dataset.tab){state.tab=b.dataset.tab;changed=true;}if(b.dataset.owner){state.owner=b.dataset.owner;changed=true;}if(b.dataset.return){state.page=state.origin==='record'?'brief':state.origin;changed=true;}if(b.dataset.source){const el=root.querySelector('#source-detail');el.hidden=!el.hidden;}if(b.dataset.accept){state.update='accepted';changed=true;}if(b.dataset.pending){state.update='pending';changed=true;}if(changed)render();});
root.querySelector('#mb-mobile').addEventListener('change',e=>{state.page=e.target.value;render();});
root.addEventListener('submit',e=>{if(e.target.id!=='capture-form')return;e.preventDefault();const data=new FormData(e.target);state.capture.push({title:String(data.get('title')),owner:String(data.get('owner')),department:String(data.get('department'))});e.target.reset();root.querySelector('#capture-message').textContent='Added to the local sample inbox. Find it in My work. No business record was changed.';});
render();
})();
</script>

</body></html>
