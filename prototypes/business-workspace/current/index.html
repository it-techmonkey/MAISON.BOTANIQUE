<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Maison workspace — design archive</title><style>:root{color-scheme:light dark;--font-voice:Georgia,serif}body{margin:16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.archive-note{margin:0 0 12px;font-size:13px;color:light-dark(#5f574a,#d4cabb)}.archive-note a{color:inherit}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}</style></head><body>

<style>
#mb-clear{--paper:light-dark(#F5EFE3,#1E1A16);--surface:light-dark(#FBF8F1,#27221C);--ink:light-dark(#25201A,#EDE6D8);--muted:light-dark(#6B6256,#C0B5A5);--line:light-dark(#DDD3C0,#51483D);--wine:light-dark(#7A2B3A,#E3A3AE);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;overflow:clip;color-scheme:light dark}
#mb-clear *{box-sizing:border-box}#mb-clear [hidden]{display:none!important}#mb-clear button,#mb-clear select,#mb-clear input{font:inherit;color:inherit}#mb-clear button{border:0;background:transparent;text-align:left;padding:0;cursor:pointer}#mb-clear button:hover{color:var(--wine)}#mb-clear button:focus-visible,#mb-clear select:focus-visible,#mb-clear input:focus-visible,#mb-clear summary:focus-visible{outline:2px solid var(--wine);outline-offset:4px}#mb-clear h1,#mb-clear h2,#mb-clear h3,#mb-clear p{margin:0}#mb-clear h1{font:29px/1.2 Georgia,serif;font-weight:400}#mb-clear h2{font-size:17px;font-weight:500}#mb-clear h3{font-size:14px;font-weight:500}#mb-clear .small{font-size:12px;color:var(--muted)}#mb-clear .header{padding:18px 26px;display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--surface)}#mb-clear .brand{font:17px Georgia,serif;letter-spacing:.5px}#mb-clear nav{display:flex;gap:24px}#mb-clear nav button{font-size:14px;padding:7px 0;border-bottom:2px solid transparent}#mb-clear nav button[aria-current=page]{border-color:var(--wine)}#mb-clear .body{max-width:1150px;margin:auto;padding:25px 30px 20px}#mb-clear .intro{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:22px}#mb-clear .intro p{margin-top:7px;font-size:14px;color:var(--muted)}#mb-clear .attention{display:flex;justify-content:space-between;align-items:center;gap:18px;border:1px solid var(--wine);border-left:3px solid var(--wine);border-radius:6px;padding:14px 17px;background:var(--surface);margin-bottom:22px}#mb-clear .attention .small{margin-top:3px}#mb-clear .attention button{font-size:13px;white-space:nowrap;text-decoration:underline;text-underline-offset:4px}#mb-clear .table{width:100%;border-collapse:collapse}#mb-clear .table th{text-align:left;font-size:12px;color:var(--muted);font-weight:400;padding:0 14px 10px 0}#mb-clear .table td{padding:14px 14px 14px 0;border-top:1px solid var(--line);vertical-align:middle}#mb-clear .table th:first-child{width:19%}#mb-clear .table th:nth-child(2){width:20%}#mb-clear .table th:last-child{width:8%}#mb-clear .table td:first-child button{font-weight:500}#mb-clear .table td:last-child{font-size:13px;color:var(--muted)}#mb-clear .table button{font-size:14px}#mb-clear .table .nextbutton{text-decoration:underline;text-underline-offset:4px}#mb-clear .status{font-size:13px;display:flex;align-items:baseline;gap:7px}#mb-clear .status::before{content:'•';color:var(--muted)}#mb-clear .status.waiting{color:var(--wine)}#mb-clear .status.waiting::before{color:var(--wine)}#mb-clear .footer{padding:12px 26px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}#mb-clear .footer button{font-size:12px;text-decoration:underline;text-underline-offset:3px}#mb-clear .back{font-size:13px;color:var(--muted);margin-bottom:16px}#mb-clear .breadcrumb{font-size:12px;color:var(--muted);margin-bottom:8px}#mb-clear .breadcrumb button{font-size:12px;text-decoration:underline;text-underline-offset:3px}#mb-clear .narrow{max-width:720px}#mb-clear .section{padding:21px 0;border-top:1px solid var(--line)}#mb-clear .section h2{margin-bottom:12px}#mb-clear .section p{color:var(--muted);font-size:14px}#mb-clear .row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:12px 0;border-bottom:1px solid var(--line)}#mb-clear .row:last-child{border-bottom:0}#mb-clear .row .small{margin-top:4px}#mb-clear .button{display:inline-block;font-size:13px!important;padding:8px 12px!important;border:1px solid var(--line)!important;border-radius:5px;white-space:nowrap}#mb-clear .primary{background:var(--ink)!important;color:var(--surface)!important;border-color:var(--ink)!important}#mb-clear .primary:disabled{opacity:.55;cursor:default}#mb-clear .next{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:20px;margin:20px 0}#mb-clear .next h2{font:23px/1.25 Georgia,serif;margin:7px 0 10px}#mb-clear .next p{color:var(--muted);font-size:14px;margin-bottom:15px}#mb-clear details{border-top:1px solid var(--line);padding:15px 0}#mb-clear summary{cursor:pointer;font-size:14px;font-weight:500}#mb-clear details p{font-size:14px;color:var(--muted);margin-top:12px}#mb-clear details .small{font-size:12px}#mb-clear .check{display:flex;align-items:start;gap:10px;padding:11px 0;font-size:14px}#mb-clear .check input{accent-color:var(--wine);width:16px;height:16px;margin-top:3px;flex-shrink:0}#mb-clear .taskfooter{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0;flex-wrap:wrap}#mb-clear .switch{display:flex;gap:4px;border:1px solid var(--line);padding:3px;border-radius:6px;background:var(--surface)}#mb-clear .switch button{font-size:13px;padding:6px 13px;border-radius:4px}#mb-clear .switch button[aria-pressed=true]{background:var(--ink);color:var(--surface)}#mb-clear .notebox{font-size:13px;color:var(--wine);padding:10px 0}#mb-clear .empty{padding:15px 0;color:var(--muted);font-size:14px}#mb-clear .tabrow{display:flex;gap:20px;margin:18px 0 4px;border-bottom:1px solid var(--line)}#mb-clear .tabrow button{padding:8px 0;border-bottom:2px solid transparent;font-size:13px}#mb-clear .tabrow button[aria-pressed=true]{border-bottom-color:var(--wine)}#mb-clear .flash{animation:mbc-in .16s ease-out}@keyframes mbc-in{from{opacity:.8;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){#mb-clear .header{padding:16px 18px}#mb-clear .body{padding:22px 18px}#mb-clear nav{gap:20px}#mb-clear h1{font-size:27px}#mb-clear .attention{align-items:start;flex-direction:column;gap:10px}#mb-clear .table,#mb-clear .table tbody,#mb-clear .table tr,#mb-clear .table td{display:block}#mb-clear .table thead{display:none}#mb-clear .table tr{padding:13px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:7px 15px}#mb-clear .table td{border:0;padding:0!important}#mb-clear .table td:nth-child(1){grid-column:1;grid-row:1}#mb-clear .table td:nth-child(2){grid-column:1;grid-row:2}#mb-clear .table td:nth-child(3){grid-column:1/-1;grid-row:3}#mb-clear .table td:nth-child(4){grid-column:2;grid-row:1}#mb-clear .row{gap:12px}#mb-clear .footer{padding:12px 18px}#mb-clear .intro{gap:12px}#mb-clear .next{padding:17px}}@media(pointer:coarse){#mb-clear button,#mb-clear summary{min-height:44px}#mb-clear .check{min-height:44px;align-items:center}}@media(prefers-reduced-motion:reduce){#mb-clear .flash{animation:none}}
</style>
<div id="mb-clear">
 <header class="header"><span class="brand">Maison Botanique</span><nav aria-label="Main navigation"><button data-page="business" aria-current="page">Business</button><button data-page="day">My day</button><button data-page="reference">Reference</button></nav></header>
 <main class="body"></main>
 <footer class="footer"><span>Fictional example workflow · not live</span><span id="mbc-feedback" role="status">Preview only</span><button data-reset="1">Reset</button></footer>
</div>
<script>
(()=>{
const root=document.getElementById('mb-clear'),main=root.querySelector('main');
const tasks={cost:{title:'Review the ad bouquet’s costs',owner:'Alex',dept:'Product',why:'This establishes what the business can afford to pay for a new customer.',steps:['Confirm the bouquet and size','Check its actual costs and discounted selling price','Record contribution and an acquisition limit'],source:'Meta launch playbook · contribution gate',evidence:'Reviewed cost worksheet for the exact bouquet. The customer-sales master cannot supply missing monetary values.'},tracking:{title:'Check purchase reporting',owner:'Alex',dept:'Tech',why:'The paid pilot needs proof that a real purchase is reported accurately.',steps:['Confirm the intended Meta dataset','Arrange an authorised checkout test','Check purchase value, duplication and click continuity'],source:'Meta launch playbook · tracking gate',evidence:'Purchase-test evidence. A checked task list alone is not proof, and this preview performs no test or payment.'},seasonal:{title:'Review the seasonal WhatsApp safeguard',owner:'Alex',dept:'Tech',why:'Seasonal date rules need to hold when an order moves through WhatsApp.',steps:['Inspect the latest review and checks','Confirm allowed delivery dates','Record the release and live-flow verification separately'],source:'Seasonal WhatsApp change · PR #39',evidence:'This fictional review is open. No live repository is connected.'},creative:{title:'Prepare the two ad creatives',owner:'Alex',dept:'Content',why:'The profile and ads need clear, truthful proof of the same real bouquet.',steps:['Confirm the same bouquet for both creatives','Prepare one static image and one preparation video','Review the assets and matching product page'],source:'Meta launch playbook · creative preparation',evidence:'Approved assets. Publication and advertising spend are separate actions.'},responses:{title:'Review customer replies',owner:'Sam',dept:'Sales',why:'The next outreach decision should use responses, opt-outs and recorded permission.',steps:['Review replies in the outreach tracker','Record what customers asked for','Decide whether any further contact is appropriate'],source:'Maintained outreach workbook',evidence:'The recorded contact history is not evidence of a sale or marketing permission.'},partner:{title:'Decide whether to continue the proposal',owner:'Sam',dept:'Partnerships',why:'Preserved drafts should be explicitly active or parked.',steps:['Review the existing Example partner proposal','Choose active or parked','Record the next action if active'],source:'Preserved Example partner proposal',evidence:'An owner decision; this preview sends no partner message.'},policy:{title:'Confirm promotion readiness',owner:'Alex',dept:'Operations & Legal',why:'The promotion-permission question remains a documented readiness check.',steps:['Review the outstanding question','Obtain appropriate written confirmation','Record the answer with its source'],source:'Meta launch playbook · outstanding readiness checks',evidence:'Written confirmation and the applicable scope. No legal conclusion is assumed here.'}};
const depts=[['Tech','Needs review','Review the WhatsApp safeguard','Alex','seasonal'],['Product','Waiting on cost review','Review the ad bouquet’s costs','Alex','cost'],['Content','Can move now','Prepare the two ad creatives','Alex','creative'],['Marketing','Waiting on launch checks','See the two missing checks','Sam','tracking'],['Sales','Can move now','Review customer replies','Sam','responses'],['Partnerships','Priority to confirm','Decide active or parked','Sam','partner'],['Operations & Legal','Needs confirmation','Confirm promotion readiness','Alex','policy']];
let s={page:'business',dept:'Product',task:'cost',person:'Alex',checks:{},review:[],origin:'department',tab:'open'};
const escape=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function intro(title,sub){return `<div class="intro"><div><h1>${title}</h1><p>${sub}</p></div></div>`;}
function breadcrumbs(task=false){return `<div class="breadcrumb"><button data-page="business">Business</button> / <button data-dept="${s.dept}">${s.dept}</button>${task?' / Task':''}</div>`;}
function openRow(id){const t=tasks[id];return `<div class="row"><div><h3>${escape(t.title)}</h3><p class="small">${t.owner} · ${s.review.includes(id)?'Ready for review':'Next action'}</p></div><button class="button" data-task="${id}">Open →</button></div>`;}
function business(){return intro('Where does the business need you?','See each department’s next move. Open one to act.')+`<section class="attention"><div><h3>The paid pilot is waiting on two checks.</h3><p class="small">Product costs and purchase reporting.</p></div><button data-dept="Marketing">See what’s missing →</button></section><table class="table"><thead><tr><th scope="col">Department</th><th scope="col">Where it stands</th><th scope="col">Next move</th><th scope="col">Owner</th></tr></thead><tbody>${depts.map(d=>`<tr><td><button data-dept="${d[0]}">${d[0]}</button></td><td><span class="status ${d[1].startsWith('Waiting')?'waiting':''}">${d[1]}</span></td><td><button class="nextbutton" data-dept="${d[0]}">${d[2]} →</button></td><td>${d[3]}</td></tr>`).join('')}</tbody></table>`;}
function department(){const d=depts.find(d=>d[0]===s.dept),ids=Object.keys(tasks).filter(id=>tasks[id].dept===s.dept);let h=breadcrumbs()+`<button class="back" data-page="business">← All departments</button>`+intro(s.dept,`${d[3]} coordinates this work in the example.`);
if(s.dept==='Marketing')return h+`<section class="section"><h2>What is stopping the pilot?</h2><div class="row"><div><h3>Cost review is unfinished</h3><p class="small">Product · Alex</p></div><button class="button" data-task="cost">Open next step →</button></div><div class="row"><div><h3>Purchase reporting needs verification</h3><p class="small">Tech · Alex</p></div><button class="button" data-task="tracking">Open next step →</button></div></section><section class="section"><h2>What can move while we wait?</h2>${openRow('creative')}</section><details><summary>Launch rules and decisions</summary><p>One Sales/Purchase pilot, one broad Dubai ad set and two ads. Seven days, a demo budget maximum total billed. Both formal gates must pass; spending needs explicit authority.</p></details>`;
h+=`<section class="next"><span class="small">${d[1]}</span><h2>${tasks[d[4]].title}</h2><p>${tasks[d[4]].why}</p><button class="button primary" data-task="${d[4]}">Start this step →</button></section><div class="tabrow"><button data-tab="open" aria-pressed="${s.tab==='open'}">Other open work</button><button data-tab="done" aria-pressed="${s.tab==='done'}">Completed</button></div>`;
if(s.tab==='done')h+=`<div class="row"><div><h3>${s.dept==='Tech'?'Seasonal delivery fixes merged':s.dept==='Product'?'Customer-sales master consolidated':'No completion example shown'}</h3><p class="small">${s.dept==='Tech'?'Example merge record; production behavior is a separate check':s.dept==='Product'?'Dataset location and analysis recorded · no monetary results inferred':'This does not mean no work has been completed.'}</p></div></div>`;
else{const rest=ids.filter(id=>id!==d[4]);h+=rest.length?rest.map(openRow).join(''):'<p class="empty">No additional work shown in this example.</p>';}
h+='<details><summary>Decisions and background</summary><p>Decisions, evidence and source history stay with the relevant work. Open a task to inspect its supporting information.</p></details>';return h;}
function task(){const t=tasks[s.task],check=s.checks[s.task]||[],ready=t.steps.every((_,i)=>check[i]);return `<div class="narrow">${breadcrumbs(true)}<button class="back" data-back="1">← ${s.origin==='day'?'My day':'Back to '+(s.parentDept||s.dept)}</button>${intro(t.title,`${t.owner} · ${t.dept}`)}<section class="section"><h2>Do this next</h2>${t.steps.map((step,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${check[i]?'checked':''}><span>${step}</span></label>`).join('')}<div class="taskfooter"><span class="small">${s.review.includes(s.task)?'Ready for human review':ready?'Steps checked · request a review next':'Work through the steps at your pace.'}</span><button class="button primary" data-review="1" ${!ready||s.review.includes(s.task)?'disabled':''}>${s.review.includes(s.task)?'Review requested':'Request review'}</button></div></section><details><summary>Why this matters</summary><p>${t.why}</p></details><details><summary>Evidence and source</summary><p>${t.evidence}</p><p class="small">Reference: ${t.source}. Snapshot from 25 Oct; current state is not refreshed.</p></details><details><summary>Decisions and history</summary><p>Checking steps does not verify completion. AI may help prepare work; an accountable person reviews the result. Preview changes remain local.</p></details></div>`;}
function day(){return intro('A small list for your day.','Choose a next step. The rest of the business stays in Business.')+`<div class="intro"><div class="switch" aria-label="Whose work">${['Alex','Sam'].map(p=>`<button data-person="${p}" aria-pressed="${s.person===p}">${p}</button>`).join('')}</div><button class="small" data-page="business">View the whole business →</button></div>${(s.person==='Alex'?['cost','seasonal','creative']:['responses','partner']).map(openRow).join('')}<p class="small" style="margin-top:18px">Suggested daily selection · not deadlines or commitments.</p>`;}
function reference(){return intro('Decisions you can return to.','Background stays available without competing with today’s work.')+`<details><summary>First-order offer</summary><p>20% for eligible first orders. Preserve the approved optional consent and code rules. No first-100 or advertised candle promise.</p></details><details><summary>Delivery policy</summary><p>Same-day promise is Dubai only. JVC free by full recipient address; other Dubai AED 30; other UAE AED 50. Live settings require separate verification.</p></details><details><summary>Product sizes</summary><p>Signature, Grand and Luxe. Flowers scale; gifts, chocolates and teddies stay fixed.</p></details><details><summary>Current operating references</summary><p>Meta launch playbook; canonical customer-sales master; operating outreach tracker; GitHub review and release records.</p><p>No revenue, AOV or profitability is inferred from the customer-sales master.</p></details><details><summary>How updates enter the workspace</summary><p>A session proposes a change against an existing task. Evidence and remaining checks travel with it. Settled decisions are replaced through an explicit new decision, with the earlier record retained.</p></details>`;}
function render(){root.querySelectorAll('nav button').forEach(b=>{if(b.dataset.page===(['department','task'].includes(s.page)?'business':s.page))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});main.innerHTML=({business,department,task,day,reference}[s.page])();main.classList.remove('flash');void main.offsetWidth;main.classList.add('flash');}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.page)s.page=d.page;else if(d.dept){s.page='department';s.dept=d.dept;s.tab='open';}else if(d.task){s.origin=s.page;s.parentDept=s.dept;s.task=d.task;s.dept=tasks[d.task].dept;s.page='task';}else if(d.back){s.page=s.origin==='day'?'day':'department';if(s.parentDept)s.dept=s.parentDept;}else if(d.person)s.person=d.person;else if(d.tab)s.tab=d.tab;else if(d.review){if(!s.review.includes(s.task))s.review.push(s.task);root.querySelector('#mbc-feedback').textContent='Review requested in this preview only.';}else if(d.reset){s={page:'business',dept:'Product',task:'cost',person:'Alex',checks:{},review:[],origin:'department',tab:'open'};root.querySelector('#mbc-feedback').textContent='Preview reset';}else return;render();});
root.addEventListener('change',e=>{if(e.target.dataset.check===undefined)return;const open=[...main.querySelectorAll('details')].map(el=>el.open);if(!s.checks[s.task])s.checks[s.task]=[];s.checks[s.task][Number(e.target.dataset.check)]=e.target.checked;const ready=tasks[s.task].steps.every((_,i)=>s.checks[s.task][i]);const button=main.querySelector('[data-review]');button.disabled=!ready||s.review.includes(s.task);main.querySelector('.taskfooter .small').textContent=ready?'Steps checked · request a review next':'Work through the steps at your pace.';root.querySelector('#mbc-feedback').textContent='Step updated locally. Completion is not verified.';});
render();
})();
</script>

</body></html>
