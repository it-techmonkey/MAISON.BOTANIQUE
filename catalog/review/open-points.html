const KEY='maison-open-points-v1';
let S={};try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LABEL={contents:'Contents to confirm',tier_qty:'Quantities for sizes',tier_gift:'Sizes and gifts',no_price:'No price',price_review:'Price to review'};
function qBlock(p,i){const a=S[p.n]||{};const v=(k)=>E(a[k]||'');let h='';
 if(i==='contents')h+=`<div class="q"><b>Confirm the contents</b><div class="why">${E(p.confirm)}</div><textarea data-k="contents" placeholder="Your answer, or leave blank if the description is fine as written">${v('contents')}</textarea></div>`;
 if(i==='tier_qty')h+=`<div class="q"><b>How many of each item in the Signature size?</b><div class="why">The listing gives no counts, so Grand (double) and Luxe (triple) cannot be spelled out yet.</div><input type="text" data-k="tier_qty" value="${v('tier_qty')}" placeholder="e.g. 20 roses, 5 lilies"></div>`;
 if(i==='tier_gift'){const o=['','Multiply everything (flowers and gifts)','Multiply flowers only, gifts stay the same','Other (explain in notes)'];h+=`<div class="q"><b>What do Grand and Luxe multiply?</b><div class="why">This set includes gifts (chocolates, teddy, cake, balloons…). Grand = double, Luxe = triple of what?</div><select data-k="tier_gift">${o.map(x=>`<option ${a.tier_gift===x?'selected':''}>${E(x)}</option>`).join('')}</select></div>`}
 if(i==='no_price'||i==='price_review')h+=`<div class="q"><b>${i==='no_price'?'Price (AED) for each size':'Check these prices (AED)'}</b><div class="why">${i==='no_price'?'The source listing had no price. Current value is blank.':'White and Gold are flat AED 669 at every size in the source, which looks like a data error.'}</div><div class="row">${p.variants.map((x,j)=>`<label>${E(x.name)} <span class="hint">(now ${E(x.price||'—')})</span><input type="number" min="0" step="1" data-k="price_${j}" value="${v('price_'+j)}" placeholder="AED"></label>`).join('')}</div></div>`;
 return h}
function card(p){const a=S[p.n]||{};return `<section class="card ${a.done?'done':''}" data-n="${p.n}">
<h2>#${p.n} · ${E(p.title)}</h2><div class="meta">${E(p.cat)}</div>
<div>${p.issues.map(i=>`<span class="tag t-${i}">${LABEL[i]}</span>`).join('')}</div>
<details><summary>Current description and sizes</summary>${p.summary?`<p>${E(p.summary)}</p>`:''}<ul>${p.items.map(x=>`<li>${E(x)}</li>`).join('')}</ul>
<div class="hint">Sizes (prices are placeholders): ${p.variants.map(x=>E(x.name)+' – AED '+E(x.price||'—')).join(' · ')}</div></details>
${p.issues.map(i=>qBlock(p,i)).join('')}
<div class="q"><b>Notes</b><textarea data-k="notes" placeholder="Anything else about this product">${E(a.notes||'')}</textarea></div>
<label class="chk"><input type="checkbox" data-k="done" ${a.done?'checked':''}> Reviewed</label></section>`}
function render(){const q=document.getElementById('q').value.toLowerCase(),f=document.getElementById('f').value,s=document.getElementById('s').value;
 const L=DATA.filter(p=>(!q||(p.n+' '+p.title).toLowerCase().includes(q))&&(!f||p.issues.includes(f))&&(!s||(s==='done')===!!(S[p.n]||{}).done));
 document.getElementById('list').innerHTML=L.map(card).join('')||'<p class="meta">Nothing matches.</p>';prog()}
function prog(){const d=DATA.filter(p=>(S[p.n]||{}).done).length;document.getElementById('pb').style.width=(100*d/DATA.length)+'%';document.getElementById('pc').textContent=d+' / '+DATA.length+' reviewed'}
document.getElementById('list').addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;const n=t.closest('.card').dataset.n;S[n]=S[n]||{};S[n][k]=t.type==='checkbox'?t.checked:t.value;save();if(k==='done'){t.closest('.card').classList.toggle('done',t.checked);prog()}});
['q','f','s'].forEach(id=>document.getElementById(id).addEventListener('input',render));
document.getElementById('dl').onclick=()=>{const rows=[['catalog_number','title','issues','reviewed','contents_answer','signature_quantity','sizes_multiply','prices','notes']];
 DATA.forEach(p=>{const a=S[p.n]||{};const prices=p.variants.map((x,j)=>a['price_'+j]?x.name+'='+a['price_'+j]:'').filter(Boolean).join('; ');
  if(Object.keys(a).length)rows.push([p.n,p.title,p.issues.join('|'),a.done?'yes':'no',a.contents||'',a.tier_qty||'',a.tier_gift||'',prices,a.notes||'']);});
 const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 const b=new Blob(['\ufeff'+csv],{type:'text/csv'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='open-points-answers.csv';l.click();URL.revokeObjectURL(u)};
render();
</script></body></html>
